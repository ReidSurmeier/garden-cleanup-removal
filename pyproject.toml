[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garden-railing-removal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pillow>=11.0", "plyfile>=1.1", "scipy>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = [
  "torch>=2.7",
  "transformers>=4.57,<5",
]

[project.scripts]
garden-railing-remove = "railing_removal.cli:main"
garden-full-cleanup = "railing_removal.full_cli:main"
garden-metashape-export = "railing_removal.metashape_cli:main"
garden-adaptive-config = "railing_removal.adaptive_cli:main"
garden-batch-cleanup = "railing_removal.batch_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/railing_removal", "src/plant_cleanup"]
